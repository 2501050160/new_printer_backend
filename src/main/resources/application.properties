spring.mail.username=${MAIL_USERNAME:saipraveendasari1@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xlcsaxdlefpogkxl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Spring Security OAuth2 Kiosk Credentials Configuration
# Fill in these credentials using environment variables or replace placeholders below:
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID:your-azure-client-id-placeholder}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET:your-azure-client-secret-placeholder}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email,User.Read
spring.security.oauth2.client.registration.azure.client-name=Microsoft
spring.security.oauth2.client.registration.azure.provider=azure
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/v1.0/me
spring.security.oauth2.client.provider.azure.user-name-attribute=displayName

# Frontend Application Redirection URL for Production deployment
app.frontend.url=${APP_FRONTEND_URL:https://cloudprint.website}

# Prevent Hibernate from creating additional isolated metadata connections on startup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.query.startup_check=false


