spring.application.name=login-registration

# =======================================================
# NeonDB / PostgreSQL Connection Configuration
# =======================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-noisy-snow-azm971ex-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_7xI5CReGAybV}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# HikariCP Connection Pool Settings (Optimized for Neon Serverless & Fast Boot)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.pool-name=NeonHikariPool

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Explicit Dialect & Hibernate Optimizations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TLcoAWuOnuIpZB}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:7u6XDG2wZg6S0QgbBCTIlYJL}

server.port=${PORT:8080}

# =======================================================
# Render 512MB RAM Optimization: Embedded Tomcat Thread Limits
# =======================================================
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=100
server.tomcat.accept-count=20

# Enable Gzip compression to minimize Render outbound bandwidth usage by 75%+
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

print.agent.enabled=true
print.cancel-window-seconds=30

# Google Drive Document Storage & 1-Day Auto-Removal Configuration
google.drive.enabled=${GOOGLE_DRIVE_ENABLED:true}
google.drive.credentials-path=${GOOGLE_DRIVE_CREDENTIALS_PATH:credentials/google-service-account.json}
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}
google.drive.folder-name=${GOOGLE_DRIVE_FOLDER_NAME:University_Cloud_Print_Uploads}
google.drive.retention-hours=${GOOGLE_DRIVE_RETENTION_HOURS:24}

# Remove PDF blob 30 minutes after order is completed
print.pdf.retention-minutes=5

# Also wipe finished-order PDF data every day at 2:00 AM
print.pdf.daily-cleanup-enabled=true
print.pdf.daily-cleanup-cron=0 0 2 * * *

# Auto-cancel and wallet refund if print not completed within 5 minutes
print.fulfillment-timeout-minutes=5

# SMTP Email Configuration
